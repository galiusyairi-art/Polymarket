# IB Gateway's app (ibgw/): created and deployed when its files change, or by hand (Actions tab ->
# "Deploy IB Gateway" -> Run workflow). Its name is the main app's with "-ibgw". It needs an IBKR
# login, from either:
#   - repository secrets IBKR_LIVE_USER and IBKR_LIVE_PASSWORD (the real account: the gateway runs
#     with real money; every login then waits for the owner's approval on the IBKR app), or
#     IBKR_PAPER_USER and IBKR_PAPER_PASSWORD (the paper account), passed on to the app, or
#   - the app's own secrets TWS_USERID and TWS_PASSWORD in the Fly dashboard (paper).
# Run by hand, "mode" picks which one (auto: the real one when its login is set).
# Without a login it stops before deploying and says so.
name: Deploy IB Gateway
on:
  push:
    branches: [claude/quirky-clarke-s5rno5]
    paths: ["ibgw/**", ".github/workflows/ibgw-deploy.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (real money when IBKR_LIVE_USER is set), paper or live"
        default: auto
        type: choice
        options: [auto, paper, live]
concurrency:
  group: ibgw-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ secrets.FLY_APP }}
      PAPER_USER: ${{ secrets.IBKR_PAPER_USER }}
      PAPER_PASSWORD: ${{ secrets.IBKR_PAPER_PASSWORD }}
      LIVE_USER: ${{ secrets.IBKR_LIVE_USER }}
      LIVE_PASSWORD: ${{ secrets.IBKR_LIVE_PASSWORD }}
      MODE: ${{ inputs.mode || 'auto' }}
    steps:
      - name: Fly.io secrets set in GitHub?
        id: ready
        run: |
          if [ -n "$FLY_API_TOKEN" ] && [ -n "$FLY_APP" ]; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "No FLY_API_TOKEN / FLY_APP repository secrets: nothing to do."; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == '1'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.ready.outputs.go == '1'
      - name: Create the app (first time only)
        if: steps.ready.outputs.go == '1'
        run: |
          if flyctl status --app "$FLY_APP-ibgw" >/dev/null 2>&1; then echo "App $FLY_APP-ibgw exists"
          else flyctl apps create "$FLY_APP-ibgw" --org personal; fi
      - name: The login (the real account's or the paper one's)
        id: login
        if: steps.ready.outputs.go == '1'
        run: |
          if [ "$MODE" = "auto" ]; then
            if [ -n "$LIVE_USER" ] && [ -n "$LIVE_PASSWORD" ]; then MODE=live; else MODE=paper; fi
          fi
          if [ "$MODE" = "live" ]; then
            if [ -z "$LIVE_USER" ] || [ -z "$LIVE_PASSWORD" ]; then
              echo "::warning::Real money picked, but the IBKR_LIVE_USER / IBKR_LIVE_PASSWORD GitHub secrets aren't set."; exit 0
            fi
            flyctl secrets set --stage --app "$FLY_APP-ibgw" TWS_USERID="$LIVE_USER" TWS_PASSWORD="$LIVE_PASSWORD"
          elif [ -n "$PAPER_USER" ] && [ -n "$PAPER_PASSWORD" ]; then
            flyctl secrets set --stage --app "$FLY_APP-ibgw" TWS_USERID="$PAPER_USER" TWS_PASSWORD="$PAPER_PASSWORD"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if flyctl secrets list --app "$FLY_APP-ibgw" | grep -q TWS_PASSWORD; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::Add an IBKR login (IBKR_LIVE_USER / IBKR_LIVE_PASSWORD, or IBKR_PAPER_USER / IBKR_PAPER_PASSWORD, as GitHub secrets), then run this workflow again."; fi
      - name: Deploy
        if: steps.login.outputs.go == '1'
        working-directory: ibgw
        run: |
          echo "IB Gateway: ${{ steps.login.outputs.mode }} account"
          flyctl deploy --remote-only --app "$FLY_APP-ibgw" --ha=false --env TRADING_MODE=${{ steps.login.outputs.mode }}
