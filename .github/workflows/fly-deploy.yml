# Every push to the working branch goes live on Fly.io (like Render's auto-deploy), and the
# first run also creates the app and its data volume in Stockholm. Everything from the browser:
#   1. Repository secrets FLY_API_TOKEN (a Fly.io token that may create apps) and FLY_APP (the
#      app's name). Without them this does nothing.
#   2. The app's own secrets (POLYBOT_PASSWORD, the wallet...) in the Fly.io dashboard. Until
#      POLYBOT_PASSWORD is there it stops before deploying and says so.
#   3. Re-run the latest run of this workflow (Actions tab -> the run -> Re-run all jobs).
name: Deploy to Fly.io
on:
  push:
    branches: [claude/quirky-clarke-s5rno5]
  workflow_dispatch:
# One deploy at a time: a push during a deploy waits for it to finish (two at once fight over
# the machine and both fail).
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ secrets.FLY_APP }}
    steps:
      - name: Fly.io secrets set in GitHub?
        id: ready
        run: |
          if [ -n "$FLY_API_TOKEN" ] && [ -n "$FLY_APP" ]; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "No FLY_API_TOKEN / FLY_APP repository secrets: nothing to do."; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == '1'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.ready.outputs.go == '1'
      - name: Create the app (first time only)
        if: steps.ready.outputs.go == '1'
        run: |
          if flyctl status --app "$FLY_APP" >/dev/null 2>&1; then echo "App $FLY_APP exists"
          else flyctl apps create "$FLY_APP" --org personal; fi
      - name: Create the data volume in Stockholm (first time only)
        if: steps.ready.outputs.go == '1'
        run: |
          if flyctl volumes list --app "$FLY_APP" | grep -q polybot_data; then echo "Volume exists"
          else flyctl volumes create polybot_data --app "$FLY_APP" --region arn --size 5 --yes; fi
      # The owner (30.10.2026): the 1 GB volume filled up and the bot stopped; 5 GB (a volume only grows).
      - name: The data volume at 5 GB
        if: steps.ready.outputs.go == '1'
        continue-on-error: true  # (the deploy goes on whatever happens here)
        run: |
          flyctl volumes list --app "$FLY_APP" --json | jq -r '.[] | select(.name == "polybot_data") | "\(.id) \(.size_gb)"' |
          while read -r id size; do
            if [ "$size" -lt 5 ]; then
              echo "Volume $id: ${size} GB -> 5 GB"
              flyctl volumes extend "$id" --size 5 --app "$FLY_APP" --yes || flyctl volumes extend "$id" --size 5 --app "$FLY_APP"
            else echo "Volume $id: ${size} GB"; fi
          done
      - name: The app's secrets are in?
        id: secrets
        if: steps.ready.outputs.go == '1'
        run: |
          if flyctl secrets list --app "$FLY_APP" | grep -q POLYBOT_PASSWORD; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::Add POLYBOT_PASSWORD (and the wallet secrets) in the Fly.io dashboard, then re-run this workflow."; fi
      # The server with the data, labelled again as the app's machine (31.10.2026): it had lost Fly's label, so a deploy
      # took it for none and launched a second server with a volume of its own (the site then answered from both by
      # turns). The machine on the biggest polybot_data volume gets the label back, so the deploy updates it. Nothing
      # is removed here; with more than one machine it stops before deploying and says so.
      - name: The server with the data, labelled as the app's machine
        id: one
        if: steps.secrets.outputs.go == '1'
        run: |
          set -e
          n=$(flyctl machines list --app "$FLY_APP" --json | jq 'length')
          if [ "$n" -gt 1 ]; then echo "::error::$n machines: only the one with the data should run. Remove the extra one in the Fly.io dashboard, then re-run."; exit 1; fi
          keep_vol=$(flyctl volumes list --app "$FLY_APP" --json | jq -r '[.[] | select(.name == "polybot_data" and (.attached_machine_id // "") != "")] | sort_by(.size_gb) | last | .id // empty')
          keep=$(flyctl volumes list --app "$FLY_APP" --json | jq -r --arg v "$keep_vol" '.[] | select(.id == $v) | .attached_machine_id // empty')
          echo "Data volume: ${keep_vol:-none}, on machine: ${keep:-none}"
          if [ -n "$keep" ]; then
            flyctl machine update "$keep" --metadata fly_platform_version=v2 --metadata fly_process_group=app --yes --app "$FLY_APP"
          fi
      - name: Deploy
        if: steps.secrets.outputs.go == '1'
        run: flyctl deploy --remote-only --app "$FLY_APP"
