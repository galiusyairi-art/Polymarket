# Fly.io: the server in Stockholm (Polymarket takes orders from Sweden). The app's name is
# given when it is created (fly launch --name ...); deploys from GitHub pass it the same way.
primary_region = "arn"

[env]
  POLYBOT_DB = "/data/polybot.sqlite"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"  # the bot never sleeps
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# The process back up whenever it ends (the guard, polybot/watchdog.py, ends a stuck bot on purpose; 06.11.2026).
[[restart]]
  policy = "always"

[[mounts]]
  source = "polybot_data"
  destination = "/data"

# A whole core of its own: the bot works all the time, and a shared core is held to 1/16 of a
# core once its short bursts are spent, which leaves the bot too slow to keep up.
[[vm]]
  memory = "2gb"
  cpu_kind = "performance"
  cpus = 1
